; ESP32-S3 flight-recorder example: a standalone PlatformIO project that
; consumes the library at the repository root exactly like an external
; consumer would (here via a local symlink instead of a git URL).
;
;   pio run -d examples/esp32_flight_recorder -t upload

[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = symlink://../..
